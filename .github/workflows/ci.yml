name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs Node, the npm version devEngines.packageManager requires, and the dependencies
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version-file: package.json
          cache: true
          # Fails instead of updating the lockfile, like npm ci
          run-install: |
            args: ['--frozen-lockfile']
      - run: npm run quality

  playwright:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs Node, the npm version devEngines.packageManager requires, and the dependencies
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version-file: package.json
          cache: true
          # Fails instead of updating the lockfile, like npm ci
          run-install: |
            args: ['--frozen-lockfile']
      - run: npx playwright install --with-deps chromium
      - run: npm run tests:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
